name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libgc-dev

      - name: Build
        run: make

      - name: Test (built-in)
        run: make test

  self-hosting:
    runs-on: ubuntu-latest
    needs: build-and-test
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libgc-dev

      - name: Build C VM
        run: make

      # The repo vendors a working shen-scheme binary (Makefile SHEN points at
      # vendor/shen-scheme/bin/shen-scheme), so the bundle builds directly.
      # Cloning + building shen-scheme from source would need its release
      # source tarball (which ships the generated shen-scheme.scm); a bare git
      # clone omits it, so `make -C shen-scheme` fails. Use the vendored binary.
      - name: Bundle (vendored shen-scheme)
        run: make bundle

      - name: Test (self-hosting)
        run: timeout 120 make run-bundle
