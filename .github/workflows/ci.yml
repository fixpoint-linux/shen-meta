name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v1

      # Tests that don't need the bundle run first (fast feedback).
      - name: Test (gc + vm suites, Debug)
        run: make test

  self-hosting:
    runs-on: ubuntu-latest
    needs: build-and-test
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v1

      # The repo vendors a working shen-scheme binary (Makefile SHEN points at
      # vendor/shen-scheme/bin/shen-scheme), so the bundle builds directly.
      # Cloning + building shen-scheme from source would need its release
      # source tarball (which ships the generated shen-scheme.scm); a bare git
      # clone omits it, so `make -C shen-scheme` fails. Use the vendored binary.
      - name: Bundle (vendored shen-scheme)
        run: make bundle

      # M6b canary: load the real ../globals.csexp into the Zig VM and prove
      # the bundled defuns stay callable (see zig/tests/vm_test.zig).
      - name: Test with real bundle (Zig M6b realBundleLoad)
        run: cd zig && zig build test -Doptimize=Debug --summary all
